services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hakili_immobilier:latest
    container_name: hakili_immobilier
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      # Cette valeur remplace une ancienne adresse MCP présente dans .env.
      MCP_SERVER_URL: http://127.0.0.1:8000/mcp
    ports:
      # Nginx sur l'hôte par défaut. HOST_BIND=0.0.0.0 pour un accès direct.
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8015}:8000"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
