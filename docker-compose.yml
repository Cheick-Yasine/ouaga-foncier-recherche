services:
  # === Application publique + MCP sur le même serveur HTTP ===
  app:
    build: .
    container_name: ouaga-foncier-app
    ports:
      # Un seul port hôte : l'API, le site et /mcp passent par le même port.
      - "127.0.0.1:8015:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      MCP_SERVER_URL: http://127.0.0.1:8000/mcp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
