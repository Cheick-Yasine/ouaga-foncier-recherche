name: Préparer les annonces pour HAKIMO
on:
  push:
    branches: [main]
    paths: ['app/prepared_data.py', 'scripts/prepare_annonces.py', '.github/workflows/prepare-annonces.yml']
  workflow_dispatch:
    inputs:
      apply_changes:
        description: Appliquer après le rapport de simulation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: annonces-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Vérifier la préparation et la base jetable
        run: python -m pytest tests/test_prepared_data.py -q
      - name: Rapport avant modification
        run: python -m scripts.prepare_annonces --output reports/simulation.json
      - name: Actualiser les tables préparées
        if: github.event_name == 'workflow_dispatch' && inputs.apply_changes
        run: python -m scripts.prepare_annonces --apply --output reports/application.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: annonces-preparees-rapport
          path: reports/*.json
          retention-days: 14
