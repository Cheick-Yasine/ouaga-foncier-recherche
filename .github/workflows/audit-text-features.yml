name: Audit caractéristiques textuelles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-text-features:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Vérifier la présence du secret Neon
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Le secret DATABASE_URL est absent."
            exit 1
          fi

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Exécuter les tests
        run: python -m pytest tests/test_text_features.py -q

      - name: Auditer les caractéristiques
        run: >-
          python -m scripts.audit_text_features
          --output reports/caracteristiques-textuelles-audit.json
          --trace-output "${RUNNER_TEMP}/caracteristiques-textuelles-trace.csv"

      - name: Publier le rapport agrégé
        uses: actions/upload-artifact@v4
        with:
          name: audit-caracteristiques-textuelles
          path: reports/caracteristiques-textuelles-audit.json
          if-no-files-found: error
          retention-days: 7
