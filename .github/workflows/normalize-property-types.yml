name: Normaliser les types de biens

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: "Appliquer réellement les changements dans Neon"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier la présence du secret Neon
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Le secret DATABASE_URL est absent."
            exit 1
          fi

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Simuler ou appliquer la normalisation
        shell: bash
        run: |
          APPLY_ARGUMENT=""
          if [ "${{ inputs.apply_changes }}" = "true" ]; then
            APPLY_ARGUMENT="--apply"
          fi
          python -m scripts.migrate_property_types             $APPLY_ARGUMENT             --output reports/type-bien-normalisation.json

      - name: Publier le rapport
        uses: actions/upload-artifact@v4
        with:
          name: type-bien-normalisation
          path: reports/type-bien-normalisation.json
          if-no-files-found: error
          retention-days: 7
