name: Audit Neon

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier la présence du secret Neon
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Ajoutez le secret GitHub DATABASE_URL avant de lancer cet audit."
            exit 1
          fi

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Exécuter l'audit en lecture seule
        run: python -m scripts.audit_neon_schema --output reports/neon-schema-audit.json

      - name: Publier le rapport
        uses: actions/upload-artifact@v4
        with:
          name: audit-neon-schema
          path: reports/neon-schema-audit.json
          if-no-files-found: error
          retention-days: 7
