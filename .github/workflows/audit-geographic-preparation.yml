name: Audit préparation géographique

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-geography:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier la présence du secret Neon
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Le secret DATABASE_URL est absent."
            exit 1
          fi

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Simuler la préparation géographique
        run: >-
          python -m scripts.audit_geographic_preparation
          --output reports/preparation-geographique-audit.json
          --trace-output "${RUNNER_TEMP}/preparation-geographique-trace.csv"

      - name: Publier les rapports
        uses: actions/upload-artifact@v4
        with:
          name: audit-preparation-geographique
          path: reports/preparation-geographique-audit.json
          if-no-files-found: error
          retention-days: 7
